name: CI

on:
    push:
        branches: [master]

    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ============================================================
    # BUILD & TEST MATRIX
    # ============================================================
    build-test:
        name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})

        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false

            matrix:
                os:
                    - ubuntu-22.04
                    - windows-2022
                    - self-hosted

                compiler:
                    - gcc
                    - clang
                    - msvc

                exclude:
                    # Ubuntu does not use MSVC
                    - os: ubuntu-22.04
                      compiler: msvc

                    # Windows uses MSVC only
                    - os: windows-2022
                      compiler: gcc

                    - os: windows-2022
                      compiler: clang

        steps:
            # ----------------------------------------------------------
            # Checkout
            # ----------------------------------------------------------
            - name: Checkout (with submodules)
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            # ----------------------------------------------------------
            # Ninja
            # ----------------------------------------------------------
            - name: Setup Ninja
              uses: seanmiddleditch/gha-setup-ninja@v5

            # ==========================================================
            # UBUNTU DEPENDENCIES
            # ==========================================================
            - name: Install dependencies (Ubuntu)
              if: runner.os == 'Linux'
              run: |
                  set -e

                  sudo apt-get update

                  sudo apt-get install -y \
                    build-essential \
                    cmake \
                    ninja-build \
                    clang \
                    clang-tidy \
                    clang-format \
                    ccache \
                    libsodium-dev \
                    libpq-dev

            # ==========================================================
            # WINDOWS / MSVC
            # ==========================================================
            - name: Setup MSVC Developer Command Prompt
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            # ----------------------------------------------------------
            # LLVM / clang-format / clang-tidy
            # ----------------------------------------------------------
            - name: Install LLVM (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  choco install llvm -y --no-progress

                  $llvmBin = "C:\Program Files\LLVM\bin"

                  if (-not (Test-Path $llvmBin)) {
                    throw "LLVM installation directory not found: $llvmBin"
                  }

                  Write-Host "LLVM bin: $llvmBin"

                  $llvmBin | Out-File `
                    -FilePath $env:GITHUB_PATH `
                    -Encoding utf8 `
                    -Append

            # ==========================================================
            # VCPKG / WINDOWS DEPENDENCIES
            # ==========================================================
            - name: Cache vcpkg (Windows)
              if: runner.os == 'Windows'
              uses: actions/cache@v4
              with:
                  path: C:\vcpkg
                  key: vcpkg-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
                  restore-keys: |
                      vcpkg-${{ runner.os }}-

            - name: Install dependencies with vcpkg (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  $vcpkgRoot = "C:\vcpkg"

                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path $vcpkgRoot | Out-Null

                  if (-not (Test-Path "$vcpkgRoot\.git")) {
                    Write-Host "Cloning vcpkg..."

                    git clone `
                      https://github.com/microsoft/vcpkg.git `
                      $vcpkgRoot
                  }

                  Push-Location $vcpkgRoot

                  git pull

                  .\bootstrap-vcpkg.bat

                  .\vcpkg.exe version

                  Write-Host "Installing Windows dependencies..."

                  .\vcpkg.exe install `
                    libsodium:x64-windows `
                    libpq:x64-windows

                  Pop-Location

            # ==========================================================
            # CCACHE / UBUNTU
            # ==========================================================
            - name: Cache ccache (Ubuntu)
              if: runner.os == 'Linux'
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ccache
                  key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
                  restore-keys: |
                      ccache-${{ runner.os }}-${{ matrix.compiler }}-

            # ==========================================================
            # CLANG FORMAT
            #
            # Run before compilation so formatting failures stop early.
            # ==========================================================
            - name: Clang-Format check (Ubuntu)
              if: runner.os == 'Linux'
              run: |
                  set -e

                  clang-format --version

                  files="$(git ls-files '*.cpp' '*.hpp' '*.h' '*.c')"

                  if [ -z "$files" ]; then
                    echo "No C/C++ source files found."
                    exit 0
                  fi

                  clang-format \
                    --dry-run \
                    --Werror \
                    $files

            - name: Clang-Format check (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  clang-format --version

                  $files = @(
                    git ls-files |
                    Where-Object {
                      $_ -match '\.(c|h|cpp|hpp)$'
                    }
                  )

                  if (-not $files) {
                    Write-Host "No source files found."
                    exit 0
                  }

                  clang-format `
                    --dry-run `
                    --Werror `
                    $files

            # ==========================================================
            # CMAKE CONFIGURATION - UBUNTU
            # ==========================================================
            - name: Configure (Ubuntu)
              if: runner.os == 'Linux'
              env:
                  CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
                  CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
              run: |
                  set -e

                  cmake \
                    -S . \
                    -B build \
                    -G Ninja \
                    -DCMAKE_BUILD_TYPE=Debug \
                    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                    -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            # ==========================================================
            # CMAKE CONFIGURATION - WINDOWS / MSVC
            # ==========================================================
            - name: Configure (Windows / MSVC)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  $tc = "C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

                  if (-not (Test-Path $tc)) {
                    throw "vcpkg CMake toolchain not found: $tc"
                  }

                  cmake `
                    -S . `
                    -B build `
                    -G Ninja `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DCMAKE_TOOLCHAIN_FILE="$tc" `
                    -DVCPKG_TARGET_TRIPLET=x64-windows `
                    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

            # ==========================================================
            # BUILD
            # ==========================================================
            - name: Build
              run: |
                  cmake --build build --parallel

            # ==========================================================
            # TEST
            # ==========================================================
            - name: Test
              working-directory: build
              run: |
                  ctest --output-on-failure

            # ==========================================================
            # CLANG-TIDY - UBUNTU
            #
            # Best effort for now. Remove "|| true" later when you want
            # clang-tidy to become a blocking quality gate.
            # ==========================================================
            - name: Clang-Tidy (Ubuntu, best-effort)
              if: runner.os == 'Linux'
              run: |
                  set -e

                  clang-tidy --version

                  files="$(git ls-files '*.cpp')"

                  if [ -z "$files" ]; then
                    echo "No C++ sources found."
                    exit 0
                  fi

                  clang-tidy \
                    $files \
                    -p build \
                    || true

            # ==========================================================
            # CLANG-TIDY - WINDOWS
            # ==========================================================
            - name: Clang-Tidy (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  clang-tidy --version

                  $cpp = @(
                    git ls-files |
                    Where-Object {
                      $_ -match '\.(cpp|cc|cxx)$'
                    }
                  )

                  if (-not $cpp) {
                    Write-Host "No C++ sources found."
                    exit 0
                  }

                  clang-tidy `
                    $cpp `
                    -p build
            # ==============================================================
            # SONARQUBE
            #
            # Runs exactly once, after the complete build/test matrix.
            #
            # IMPORTANT:
            # This runner must have network access to the private SonarQube
            # server.
            # ==============================================================
            - name: Test SonarQube connectivity
              if: runner.os == 'self-hosted'
              shell: pwsh
              env:
                  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
              run: |
                  $ErrorActionPreference = "Stop"

                  if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
                    throw "SONAR_HOST_URL is not configured"
                  }

                  $url = "$($env:SONAR_HOST_URL.TrimEnd('/'))/api/system/status"

                  Write-Host "Testing SonarQube: $url"

                  $response = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 30

                  Write-Host "HTTP Status: $($response.StatusCode)"
                  Write-Host $response.Content

            - name: SonarQube
              if: runner.os == 'self-hosted'
              uses: SonarSource/sonarqube-scan-action@master
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

            # ==========================================================
            # WINDOWS PACKAGE
            #
            # IMPORTANT:
            # This must only run for the Windows/MSVC matrix entry.
            # ==========================================================
            - name: Package dist (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  # --------------------------------------------------------
                  # Ensure directories
                  # --------------------------------------------------------
                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path `
                      "dist\bin",
                      "dist\plugins",
                      "dist\plugins\runtime",
                      "dist\config",
                      "dist\static" |
                    Out-Null


                  # --------------------------------------------------------
                  # Verify build directory
                  # --------------------------------------------------------
                  Write-Host "=== Listing build tree (top) ==="

                  if (Test-Path "build") {

                    Get-ChildItem `
                      build `
                      -Recurse `
                      -Force |
                      Select-Object Name, FullName

                  }
                  else {

                    Write-Host "build folder not found."

                    Get-ChildItem `
                      . `
                      -Recurse `
                      -Force |
                      Select-Object Name, FullName

                    throw `
                      "build folder not found. Ensure you configured with: cmake -S . -B build ..."
                  }


                  # --------------------------------------------------------
                  # Locate WebServer.exe
                  # --------------------------------------------------------
                  Write-Host "=== Searching for WebServer.exe under build/ ==="

                  $exe = Get-ChildItem `
                    -Path "build" `
                    -Recurse `
                    -File `
                    -Filter "WebServer.exe" `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if (-not $exe) {

                    Write-Host `
                      "WebServer.exe not found. Searching for any .exe produced..."

                    Get-ChildItem `
                      -Path "build" `
                      -Recurse `
                      -File `
                      -Filter "*.exe" `
                      -ErrorAction SilentlyContinue |
                      Select-Object FullName, Length |
                      Sort-Object FullName |
                      Format-Table -AutoSize

                    throw `
                      "WebServer.exe not found under build/. Check target name or output directory."
                  }


                  # --------------------------------------------------------
                  # vcpkg runtime
                  # --------------------------------------------------------
                  $vcpkgRoot = "C:\vcpkg"
                  $triplet = "x64-windows"

                  $installedBin = Join-Path `
                    $vcpkgRoot `
                    "installed\$triplet\bin"

                  if (-not (Test-Path $installedBin)) {
                    throw `
                      "vcpkg installed bin not found: $installedBin"
                  }


                  # --------------------------------------------------------
                  # Copy vcpkg runtime DLLs
                  # --------------------------------------------------------
                  Get-ChildItem `
                    -Path $installedBin `
                    -Filter "*.dll" `
                    -File |
                    ForEach-Object {

                      Copy-Item `
                        -LiteralPath $_.FullName `
                        -Destination "dist\bin" `
                        -Force
                    }


                  # --------------------------------------------------------
                  # Copy DLLs next to WebServer.exe
                  # --------------------------------------------------------
                  $exeDir = $exe.Directory.FullName

                  Write-Host "WebServer.exe: $($exe.FullName)"
                  Write-Host "Exe directory: $exeDir"

                  Get-ChildItem `
                    -Path $exeDir `
                    -Filter "*.dll" `
                    -File `
                    -ErrorAction SilentlyContinue |
                    ForEach-Object {

                      Copy-Item `
                        -LiteralPath $_.FullName `
                        -Destination "dist\bin" `
                        -Force
                    }


                  # --------------------------------------------------------
                  # Copy executable
                  # --------------------------------------------------------
                  Copy-Item `
                    -LiteralPath $exe.FullName `
                    -Destination "dist\bin\WebServer.exe" `
                    -Force


                  # --------------------------------------------------------
                  # Copy DLLs next to executable
                  # --------------------------------------------------------
                  Get-ChildItem `
                    -Path $exeDir `
                    -Filter "*.dll" `
                    -ErrorAction SilentlyContinue |
                    ForEach-Object {

                      Copy-Item `
                        -LiteralPath $_.FullName `
                        -Destination "dist\bin\" `
                        -Force
                    }


                  # --------------------------------------------------------
                  # Copy plugin DLLs
                  # --------------------------------------------------------
                  $searchRoots = @("build")

                  foreach ($root in $searchRoots) {

                    if (Test-Path $root) {

                      Get-ChildItem `
                        -Path $root `
                        -Recurse `
                        -File `
                        -Filter "*Plugin*.dll" `
                        -ErrorAction SilentlyContinue |
                        ForEach-Object {

                          Copy-Item `
                            -LiteralPath $_.FullName `
                            -Destination "dist\plugins\" `
                            -Force
                        }
                    }
                  }


                  # --------------------------------------------------------
                  # MSVC CRT
                  # --------------------------------------------------------
                  $crtDir = Get-ChildItem `
                    "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
                    -Directory `
                    -ErrorAction SilentlyContinue |
                    Sort-Object FullName -Descending |
                    Select-Object -First 1

                  if (-not $crtDir) {
                    throw `
                      "MSVC CRT directory not found. Ensure VS 2022 Build Tools with C++ workload is installed."
                  }

                  Copy-Item `
                    -Force `
                    "$($crtDir.FullName)\*.dll" `
                    "dist\bin\"


                  # --------------------------------------------------------
                  # Display package contents
                  # --------------------------------------------------------
                  Write-Host "=== dist\bin ==="

                  Get-ChildItem `
                    dist\bin |
                    Select-Object Name, Length

                  Write-Host "=== dist\plugins ==="

                  Get-ChildItem `
                    dist\plugins |
                    Select-Object Name, Length


                  # --------------------------------------------------------
                  # Copy configuration
                  # --------------------------------------------------------
                  if (Test-Path "config.prod.json") {

                    Copy-Item `
                      "config.prod.json" `
                      "dist\config\config.prod.json" `
                      -Force

                  }
                  elseif (Test-Path "config.json") {

                    Copy-Item `
                      "config.json" `
                      "dist\config\config.prod.json" `
                      -Force
                  }


                  # --------------------------------------------------------
                  # Copy static content
                  # --------------------------------------------------------
                  if (Test-Path "TestStaticContent\index.html") {

                    Copy-Item `
                      "TestStaticContent\index.html" `
                      "dist\static\index.html" `
                      -Force
                  }


                  # --------------------------------------------------------
                  # Final package
                  # --------------------------------------------------------
                  Write-Host "=== dist content ==="

                  Get-ChildItem `
                    dist `
                    -Recurse |
                    Select-Object FullName, Length

                  Compress-Archive `
                    -Path dist\* `
                    -DestinationPath "Falcata-win64.zip" `
                    -Force

            # ==========================================================
            # WINDOWS ARTIFACT
            # ==========================================================
            - name: Upload artifact (Windows)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: falcata-win64
                  path: Falcata-win64.zip
                  if-no-files-found: error
                  retention-days: 7
